name: Verify and Release

on:
  push:
    branches:
      - master
      - beta

permissions:
  contents: read # Default for checkout

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm clean-install

      - name: Verify signatures
        run: npm audit signatures

      - name: Run lint and tests
        run: npm run test-eslint

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # Needed to publish releases and tags
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm clean-install

      - name: Verify signatures
        run: npm audit signatures

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.CRUNCHTIME_TOKEN }}

  deploy-stable:
    needs: release
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      READ_ACCESS_TOKEN: ${{ secrets.READ_ACCESS_TOKEN }}
      NEXT_PUBLIC_TMDB_BASE_URL: ${{ vars.NEXT_PUBLIC_TMDB_BASE_URL}}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync Git to Latest Release Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin master

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.CRUNCHTIME_VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.CRUNCHTIME_VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel --prod --token=${{ secrets.CRUNCHTIME_VERCEL_TOKEN }}

  deploy-beta:
    needs: release
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      READ_ACCESS_TOKEN: ${{ secrets.READ_ACCESS_TOKEN }}
      NEXT_PUBLIC_TMDB_BASE_URL: ${{ vars.NEXT_PUBLIC_TMDB_BASE_URL}}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync Git to Latest Release Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin beta

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.CRUNCHTIME_VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.CRUNCHTIME_VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel --token=${{ secrets.CRUNCHTIME_VERCEL_TOKEN }}
